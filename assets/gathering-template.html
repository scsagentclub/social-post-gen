<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>那晚，我们聊了很多</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #FFF8F0;
      --panel: #ffffff;
      --ink: #3D2B1F;
      --muted: #B0A090;
      --accent: #FF6B35;
      --accent-light: #FFAB91;
      --line: rgba(61, 43, 31, .10);
      --shadow: 0 20px 50px rgba(255, 107, 53, .12);
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      line-height: 1.8;
    }

    .page {
      width: min(960px, calc(100% - 40px));
      margin: 0 auto;
    }

    /* ===== Hero ===== */
    .hero {
      text-align: center;
      padding: clamp(64px, 10vh, 120px) 0 clamp(40px, 5vh, 64px);
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(255,171,64,.10) 0%, transparent 60%);
    }

    .hero-kicker {
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .hero-kicker::before {
      content: "";
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #FF4081;
      margin-right: 10px;
      vertical-align: middle;
    }

    h1 {
      margin: 0 0 16px;
      font-family: "Noto Serif SC", "Songti SC", "STSong", serif;
      font-size: clamp(36px, 6.5vw, 72px);
      font-weight: 600;
      line-height: 1.1;
      letter-spacing: 0.04em;
    }

    .hero-meta {
      font-size: 15px;
      color: var(--muted);
      margin-bottom: 28px;
    }

    .hero-lead {
      max-width: 520px;
      margin: 0 auto;
      font-size: 17px;
      color: #6D4C41;
    }

    /* ===== Section ===== */
    section {
      padding: clamp(48px, 7vh, 80px) 0;
      border-bottom: 1px solid var(--line);
    }

    .section-head {
      text-align: center;
      margin-bottom: 36px;
    }

    .section-head h2 {
      font-family: "Noto Serif SC", "Songti SC", "STSong", serif;
      font-size: clamp(26px, 3.5vw, 38px);
      font-weight: 600;
      margin: 0 0 10px;
      letter-spacing: 0.04em;
    }

    .section-head p {
      color: var(--muted);
      font-size: 15px;
      margin: 0;
    }

    .copy-block {
      max-width: 640px;
      margin: 0 auto;
      text-align: center;
      font-size: 16px;
      color: #5D4037;
    }

    /* ===== Gallery ===== */
    .gallery input[type="radio"] {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .gallery-frame {
      padding: 10px;
      background: var(--panel);
      border: 2px solid #FFE0B2;
      border-radius: 4px;
      box-shadow: var(--shadow);
    }

    .gallery-view {
      position: relative;
      aspect-ratio: 16 / 9;
      overflow: hidden;
    }

    .gallery-view figure {
      position: absolute;
      inset: 0;
      margin: 0;
      opacity: 0;
      transform: scale(1.04);
      transition: opacity 0.85s ease, transform 1.1s ease;
    }

    .gallery-view figure img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: grayscale(45%);
      transition: filter 0.85s ease;
    }

    .gallery-view figcaption {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 42px 28px 22px;
      background: linear-gradient(0deg, rgba(28, 22, 16, .58), transparent);
      color: #f2ebe2;
      font-size: 15px;
      line-height: 1.6;
      opacity: 0;
      transition: opacity 0.5s ease 0.2s;
    }

    /* active slide */
    #g1:checked ~ .gallery-frame .gallery-view #slide-g1,
    #g2:checked ~ .gallery-frame .gallery-view #slide-g2,
    #g3:checked ~ .gallery-frame .gallery-view #slide-g3,
    #g4:checked ~ .gallery-frame .gallery-view #slide-g4,
    #g5:checked ~ .gallery-frame .gallery-view #slide-g5,
    #g6:checked ~ .gallery-frame .gallery-view #slide-g6 {
      opacity: 1;
      transform: scale(1);
      z-index: 2;
    }

    #g1:checked ~ .gallery-frame .gallery-view #slide-g1 img,
    #g2:checked ~ .gallery-frame .gallery-view #slide-g2 img,
    #g3:checked ~ .gallery-frame .gallery-view #slide-g3 img,
    #g4:checked ~ .gallery-frame .gallery-view #slide-g4 img,
    #g5:checked ~ .gallery-frame .gallery-view #slide-g5 img,
    #g6:checked ~ .gallery-frame .gallery-view #slide-g6 img {
      filter: grayscale(0%);
    }

    #g1:checked ~ .gallery-frame .gallery-view #slide-g1 figcaption,
    #g2:checked ~ .gallery-frame .gallery-view #slide-g2 figcaption,
    #g3:checked ~ .gallery-frame .gallery-view #slide-g3 figcaption,
    #g4:checked ~ .gallery-frame .gallery-view #slide-g4 figcaption,
    #g5:checked ~ .gallery-frame .gallery-view #slide-g5 figcaption,
    #g6:checked ~ .gallery-frame .gallery-view #slide-g6 figcaption {
      opacity: 1;
    }

    /* menu */
    .gallery-menu {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 26px;
      flex-wrap: wrap;
    }

    .gallery-menu label {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 16px 22px;
      min-width: 84px;
      cursor: pointer;
      border: 1px solid transparent;
      background: transparent;
      transition: all 0.4s ease;
      color: var(--muted);
    }

    .gallery-menu label .num {
      font-size: 24px;
      font-weight: 300;
      font-family: Georgia, "Times New Roman", serif;
      color: #FFCCBC;
      line-height: 1;
      transition: color 0.4s;
    }

    .gallery-menu label .name {
      font-size: 13px;
      letter-spacing: 0.12em;
    }

    .gallery-menu label:hover {
      border-color: #FFAB91;
      background: #FFF3E0;
      color: var(--ink);
    }

    .gallery-menu label:hover .num {
      color: #FF6B35;
    }

    /* active menu item */
    #g1:checked ~ .gallery-menu label[for="g1"],
    #g2:checked ~ .gallery-menu label[for="g2"],
    #g3:checked ~ .gallery-menu label[for="g3"],
    #g4:checked ~ .gallery-menu label[for="g4"],
    #g5:checked ~ .gallery-menu label[for="g5"],
    #g6:checked ~ .gallery-menu label[for="g6"] {
      background: var(--ink);
      color: #f2ebe2;
      border-color: var(--ink);
    }

    #g1:checked ~ .gallery-menu label[for="g1"] .num,
    #g2:checked ~ .gallery-menu label[for="g2"] .num,
    #g3:checked ~ .gallery-menu label[for="g3"] .num,
    #g4:checked ~ .gallery-menu label[for="g4"] .num,
    #g5:checked ~ .gallery-menu label[for="g5"] .num,
    #g6:checked ~ .gallery-menu label[for="g6"] .num {
      color: #FFD180;
    }

    /* ===== Closing ===== */
    .closing {
      text-align: center;
      padding: clamp(48px, 7vh, 80px) 0;
    }

    .closing p {
      max-width: 480px;
      margin: 0 auto;
      font-family: "Noto Serif SC", "Songti SC", "STSong", serif;
      font-size: clamp(18px, 2.5vw, 24px);
      line-height: 1.7;
      color: #5D4037;
    }

    .closing .signature {
      margin-top: 28px;
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 0.15em;
    }

    /* ===== Responsive ===== */
    @media (max-width: 640px) {
      .page { width: calc(100% - 28px); }
      .gallery-menu label { padding: 12px 14px; min-width: 64px; }
      .gallery-menu label .num { font-size: 20px; }
      .gallery-view figcaption { padding: 32px 18px 16px; font-size: 14px; }
    }

    @media print {
      body { background: #fff; }
    }
  </style>
</head>
<body>

  <header class="page hero">
    <div class="hero-kicker">聚餐回顾</div>
    <h1>那晚，我们聊了很多</h1>
    <div class="hero-meta">2025.05.24 · 老地方私房小馆</div>
    <p class="hero-lead">九个人，四小时，从凉菜吃到打烊。</p>
  </header>

  <main class="page">

    <section id="about">
      <div class="section-head">
        <h2>关于那个晚上</h2>
        <p>没有议程，没有主持人</p>
      </div>
      <div class="copy-block">
        <p>有人带了最近卡壳的事，有人只是想来听。话题从工作跑飞到童年，再绕回明年想做什么。服务员来提醒打烊的时候，一半人还没说完。</p>
      </div>
    </section>

    <section id="moments">
      <div class="section-head">
        <h2>六个瞬间</h2>
        <p>点击下方数字，看看那晚发生了什么</p>
      </div>

      <div class="gallery">
        <input type="radio" name="g" id="g1" checked>
        <input type="radio" name="g" id="g2">
        <input type="radio" name="g" id="g3">
        <input type="radio" name="g" id="g4">
        <input type="radio" name="g" id="g5">
        <input type="radio" name="g" id="g6">

        <div class="gallery-frame">
          <div class="gallery-view">
            <figure id="slide-g1">
              <img src="https://your-image-bed.example.com/gathering-photo-1.jpg" alt="聚餐瞬间 01">
              <figcaption>人到齐之前，桌上已经摆好了凉菜和闲话。</figcaption>
            </figure>
            <figure id="slide-g2">
              <img src="https://your-image-bed.example.com/gathering-photo-2.jpg" alt="聚餐瞬间 02">
              <figcaption>有人提起一个想法，邻座接了话头，话题开始跑了。</figcaption>
            </figure>
            <figure id="slide-g3">
              <img src="https://your-image-bed.example.com/gathering-photo-3.jpg" alt="聚餐瞬间 03">
              <figcaption>酒过三巡，手机掏出来记笔记的人变多了。</figcaption>
            </figure>
            <figure id="slide-g4">
              <img src="https://your-image-bed.example.com/gathering-photo-4.jpg" alt="聚餐瞬间 04">
              <figcaption>两个完全不相干的人，发现做过同一件蠢事。</figcaption>
            </figure>
            <figure id="slide-g5">
              <img src="https://your-image-bed.example.com/gathering-photo-5.jpg" alt="聚餐瞬间 05">
              <figcaption>服务员来提醒打烊，才发现已经坐了四个小时。</figcaption>
            </figure>
            <figure id="slide-g6">
              <img src="https://your-image-bed.example.com/gathering-photo-6.jpg" alt="聚餐瞬间 06">
              <figcaption>有人提议换个地方接着聊，于是一半人去了下一场。</figcaption>
            </figure>
          </div>
        </div>

        <div class="gallery-menu">
          <label for="g1"><span class="num">01</span><span class="name">开场</span></label>
          <label for="g2"><span class="num">02</span><span class="name">热络</span></label>
          <label for="g3"><span class="num">03</span><span class="name">认真</span></label>
          <label for="g4"><span class="num">04</span><span class="name">碰撞</span></label>
          <label for="g5"><span class="num">05</span><span class="name">收尾</span></label>
          <label for="g6"><span class="num">06</span><span class="name">续摊</span></label>
        </div>
      </div>
    </section>

    <section class="closing">
      <p>好菜会凉，但好话题不会。</p>
      <div class="signature">—  Agent 协作创新会 · 聚餐恳谈</div>
    </section>

  </main>

</body>
</html>
